<script>
// Custom cursor
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.transform = `translate(${mx - 5}px, ${my - 5}px)`;
});
function animRing() {
  rx += (mx - rx - 18) * 0.15;
  ry += (my - ry - 18) * 0.15;
  ring.style.transform = `translate(${rx}px, ${ry}px)`;
  requestAnimationFrame(animRing);
}
animRing();

// Hover cursor
document.querySelectorAll('a, button, .service-item').forEach(el => {
  el.addEventListener('mouseenter', () => { cursor.style.transform += ' scale(2.5)'; ring.style.opacity='0.2'; });
  el.addEventListener('mouseleave', () => { ring.style.opacity='0.6'; });
});

// Scroll reveal
const reveals = document.querySelectorAll('.reveal');
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
    }
  });
}, { threshold: 0.12 });
reveals.forEach(el => obs.observe(el));

// Staggered reveals for service items
document.querySelectorAll('.service-item').forEach((el, i) => {
  el.style.transitionDelay = `${i * 80}ms`;
  el.style.opacity = '0';
  el.style.transform = 'translateX(-30px)';
  el.style.transition = 'opacity .5s ease, transform .5s ease, padding-left .35s ease, background .35s ease';
  const itemObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.style.opacity = '1';
        e.target.style.transform = 'translateX(0)';
      }
    });
  }, { threshold: 0.1 });
  itemObs.observe(el);
});
</script>
